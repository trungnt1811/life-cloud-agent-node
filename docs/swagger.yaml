definitions:
  dto.CreateExampleRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  dto.EnabledQueryFieldDTO:
    properties:
      enabled:
        type: boolean
      field_code:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  dto.EnabledQueryFieldListDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.EnabledQueryFieldDTO'
        type: array
    type: object
  dto.ErrorDTOResponse:
    properties:
      code:
        type: string
      errors: {}
      message:
        type: string
      status:
        type: integer
    type: object
  dto.ExampleDTO:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.ExampleDeletedDTO:
    properties:
      deleted:
        type: boolean
      id:
        type: string
    type: object
  dto.ExampleListDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.ExampleDTO'
        type: array
      next_page:
        type: integer
      page:
        type: integer
      page_size:
        type: integer
      total_count:
        type: integer
    type: object
  dto.UpdateEnabledQueryFieldRequest:
    properties:
      enabled:
        type: boolean
    required:
    - enabled
    type: object
  dto.UpdateExampleRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
info:
  contact: {}
  title: Life Cloud Node Agent API
paths:
  /admin/query-fields:
    get:
      description: List all schema v1 field codes with this node's local whitelist
        state
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EnabledQueryFieldListDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
      security:
      - BasicAuth: []
      summary: List enabled query fields
      tags:
      - admin
  /admin/query-fields/{field_code}:
    put:
      consumes:
      - application/json
      description: |-
        Set enabled for one schema v1 field_code; updated_by is
        derived from the authenticated Basic Auth identity
      parameters:
      - description: Schema v1 field code
        in: path
        name: field_code
        required: true
        type: string
      - description: Enablement update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateEnabledQueryFieldRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EnabledQueryFieldDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
      security:
      - BasicAuth: []
      summary: Update an enabled query field
      tags:
      - admin
  /api/v1/examples:
    get:
      consumes:
      - application/json
      description: List examples with pagination
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ExampleListDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
      summary: List examples
      tags:
      - examples
    post:
      consumes:
      - application/json
      description: Create a new example
      parameters:
      - description: Example to create
        in: body
        name: example
        required: true
        schema:
          $ref: '#/definitions/dto.CreateExampleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ExampleDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
      summary: Create a new example
      tags:
      - examples
  /api/v1/examples/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an example by ID
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ExampleDeletedDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
      summary: Delete an example
      tags:
      - examples
    get:
      consumes:
      - application/json
      description: Get an example by ID
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ExampleDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
      summary: Get an example by ID
      tags:
      - examples
    put:
      consumes:
      - application/json
      description: Update an example by ID
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: string
      - description: Example fields to update
        in: body
        name: example
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateExampleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ExampleDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorDTOResponse'
      summary: Update an example
      tags:
      - examples
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
